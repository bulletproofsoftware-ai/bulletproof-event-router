    name: "Memory: Daily Conflict Resolver"
    schedule: "daily 1:30AM"
    cron: "30 1 * * *"
    triggers: ["schedule.conflict_check"]
    sla_minutes: 10
    priority: medium
    enabled: true

  session-recording-sync:
    id: "OQOV8h3BIO1TB3BC"
