# Workflow Registry — Live n8n workflows on http://localhost:5678
# REQ-ED-003: All n8n workflows cataloged with metadata
# Used by event-router (PRD 13) for dispatch + health monitoring

version: "1.0"
description: "Catalog of n8n workflows with SLA, schedule, triggers, and dependency metadata"

workflows:
  # === Memory pipeline (PRD 4 support) ===
  claude-memory-gateway:
    id: "MSvaRPMrLFrDQ4jQ"
    name: "Claude Memory Gateway"
    description: "Primary gateway for memory operations from Claude Code sessions"
    schedule: "webhook"
    triggers: ["memory.gateway"]
    sla_minutes: 1
    failure_action: "retry_then_alert"
    priority: high
    enabled: true

  agent-output-visual-formatter:
    id: "JL3TwotMtyHLsGT2"
    name: "Agent Output Visual Formatter"
    description: "Formats agent outputs for dashboard display"
    schedule: "webhook"
    triggers: ["agent.complete"]
    sla_minutes: 2
    priority: medium
    enabled: true

  session-extraction:
    id: "session-extraction"
    name: "Session Transcript Extraction"
    schedule: "every 2 hours"
    cron: "0 */2 * * *"
    triggers: ["session.end", "schedule.session_extraction"]
    inputs: ["session_id", "session_path"]
    outputs: ["extracted_memories"]
    dependencies: ["qdrant", "claude-api"]
    sla_minutes: 10
    failure_action: "retry_then_alert"
    priority: high
    enabled: true

  memory-compaction:
    id: "memory-compaction-wf"
    name: "Memory Compaction Workflow"
    schedule: "every 6 hours"
    cron: "0 */6 * * *"
    triggers: ["schedule.compaction"]
    sla_minutes: 30
    priority: medium
    enabled: true

  compliance-report:
    id: "compliance-report"
    name: "Memory: Compliance Report"
    schedule: "weekly"
    triggers: ["schedule.compliance_report"]
    sla_minutes: 15
    priority: high
    enabled: true

  benchmark-regression:
    id: "benchmark-regression"
    name: "Memory: Benchmark Regression"
    schedule: "daily"
    triggers: ["schedule.benchmark"]
    sla_minutes: 20
    priority: medium
    enabled: true

  active-pruning:
    id: "active-pruning"
    name: "Memory: Active Pruning"
    schedule: "daily 02:00 UTC"
    cron: "0 2 * * *"
    triggers: ["schedule.prune"]
    sla_minutes: 30
    priority: medium
    enabled: true

  identity-auto-register:
    id: "Sid0vWyr7uo0szh9"
    name: "Memory: Identity Auto-Register"
    schedule: "weekly Mon 7AM"
    cron: "0 7 * * 1"
