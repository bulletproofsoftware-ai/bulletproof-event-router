    priority: medium
    enabled: true

  world-model-sync:
    id: "HtMxQzE8BK6DgqH2"
    name: "Memory: World Model Sync"
    schedule: "daily 5AM"
    cron: "0 5 * * *"
    triggers: ["schedule.world_model_sync"]
    sla_minutes: 15
    priority: medium
    enabled: true

  conflict-resolver:
