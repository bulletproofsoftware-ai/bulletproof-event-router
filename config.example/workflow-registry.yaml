# Workflow Registry — EXAMPLE
#
# Catalog of the n8n workflows this router knows about. The router uses it for
# health tracking: it matches n8n execution records to the `id` values below and
# compares run recency against `sla_minutes` to decide whether a workflow is
# healthy, late, or failing.
#
# This file is an EXAMPLE. Copy it to your EVENTS_DIR (or point
# WORKFLOW_REGISTRY_PATH at it) and replace every entry with your own workflows.
#
# Getting your real workflow ids:
#   curl -s -H "X-N8N-API-KEY: $N8N_API_KEY" \
#     "$N8N_BASE_URL/api/v1/workflows" | jq -r '.data[] | "\(.id)\t\(.name)"'
#
# The `id` MUST match the n8n workflow id exactly, or health tracking silently
# reports the workflow as never having run.

version: "1.0"
description: "Catalog of n8n workflows with SLA, schedule, triggers, and dependency metadata"

workflows:
  # --- Webhook-triggered example -------------------------------------------
  # Fires whenever the router dispatches an event matching one of `triggers`.
  example-agent-complete-handler:
    id: "REPLACE_WITH_N8N_WORKFLOW_ID"
    name: "Example: Agent Complete Handler"
    description: "Receives agent.complete events and records the result downstream"
    schedule: "webhook"
    triggers: ["agent.complete"]
    sla_minutes: 2
    failure_action: "retry_then_alert"
    priority: medium
    enabled: true

  # --- Failure-path example ------------------------------------------------
  example-failure-alert:
    id: "REPLACE_WITH_N8N_WORKFLOW_ID"
    name: "Example: Failure Alert"
    description: "Notifies an on-call channel when an agent or gate fails"
    schedule: "webhook"
    triggers: ["agent.fail", "governance.violation"]
    sla_minutes: 1
    failure_action: "retry_then_alert"
    priority: high
    enabled: true

  # --- Scheduled example with dependencies ---------------------------------
  # `dependencies` is documentation only; the router does not resolve them.
  example-nightly-rollup:
    id: "REPLACE_WITH_N8N_WORKFLOW_ID"
    name: "Example: Nightly Rollup"
    description: "Aggregates the day's events into a summary record"
    schedule: "daily 02:00"
    cron: "0 2 * * *"
    triggers: ["schedule.nightly_rollup"]
    inputs: ["date"]
    outputs: ["rollup_record"]
    dependencies: ["database"]
    sla_minutes: 30
    priority: medium
    enabled: true

  # --- Session lifecycle example -------------------------------------------
  example-session-archiver:
    id: "REPLACE_WITH_N8N_WORKFLOW_ID"
    name: "Example: Session Archiver"
    description: "Archives session transcripts when a session ends"
    schedule: "every 2 hours"
    cron: "0 */2 * * *"
    triggers: ["session.end", "schedule.session_archive"]
    sla_minutes: 10
    failure_action: "retry_then_alert"
    priority: high
    enabled: true

  # --- Disabled example ----------------------------------------------------
  # `enabled: false` keeps the entry documented but excludes it from health
  # checks, so a workflow you have not built yet does not report as unhealthy.
  example-weekly-report:
    id: "REPLACE_WITH_N8N_WORKFLOW_ID"
    name: "Example: Weekly Report"
    description: "Emails a weekly summary; not yet built"
    schedule: "weekly Mon 09:00"
    cron: "0 9 * * 1"
    triggers: ["schedule.weekly_report"]
    sla_minutes: 60
    priority: low
    enabled: false
