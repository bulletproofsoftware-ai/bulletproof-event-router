  # === Added 2026-05-18 — drift sync from n8n ===
  drm-canary:
    id: "Lo6lFCmS9Si4lkCL"
    name: "Memory: DRM Canary"
    description: "Weekly Drone Recall Memory canary check — validates that an expected memory point can be recalled"
    schedule: "weekly Mon 3AM"
    cron: "0 3 * * 1"
    triggers: ["schedule.drm_canary"]
